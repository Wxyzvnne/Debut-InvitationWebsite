<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal 18th Debut Invitation</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at top, #8b0000, #4b0000 60%, #2a0000);
    color:#fff;
    overflow-x:hidden;
}

/* Floating Gold Sparkles */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background-image: radial-gradient(#d4af37 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.08;
    animation: sparkle 60s linear infinite;
    z-index:-1;
}

@keyframes sparkle{
    from{transform:translate(0,0);}
    to{transform:translate(-200px,-200px);}
}

/* Hero Section */
.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.royal-card{
    background:rgba(0,0,0,0.65);
    border:2px solid #d4af37;
    border-radius:25px;
    padding:70px 40px;
    max-width:750px;
    box-shadow:0 0 50px rgba(212,175,55,0.5);
    animation: fadeIn 2s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

.hero h1{
    font-family:'Cinzel',serif;
    font-size:3.8rem;
    color:#d4af37;
    letter-spacing:3px;
}

.hero h2{
    margin-top:20px;
    font-weight:300;
    font-size:1.2rem;
}

.hero button{
    margin-top:35px;
    padding:14px 45px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#d4af37,#f7e27c);
    color:#4b0000;
    font-weight:600;
    cursor:pointer;
    transition:0.4s;
}

.hero button:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px #d4af37;
}

/* Sections */
section{
    padding:90px 20px;
    text-align:center;
}

section h2{
    font-family:'Cinzel',serif;
    font-size:2.7rem;
    margin-bottom:25px;
    color:#d4af37;
}

.details p{
    margin:12px 0;
    font-size:1.1rem;
}

/* Countdown */
.countdown{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:40px;
    flex-wrap:wrap;
}

.count-box{
    background:rgba(0,0,0,0.7);
    border:1px solid #d4af37;
    padding:25px;
    border-radius:20px;
    min-width:100px;
}

.count-box h3{
    font-size:2rem;
    color:#d4af37;
}

/* RSVP */
form{
    max-width:450px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:15px;
}

input,textarea{
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
}

.submit-btn{
    background:linear-gradient(45deg,#d4af37,#f7e27c);
    border:none;
    padding:14px;
    border-radius:50px;
    font-weight:600;
    color:#4b0000;
    cursor:pointer;
}

footer{
    padding:25px;
    background:rgba(0,0,0,0.6);
    text-align:center;
}

/* Responsive */
@media(max-width:768px){
    .hero h1{
        font-size:2.5rem;
    }
    section h2{
        font-size:2rem;
    }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <div class="royal-card">
        <h1>👑 Royal Invitation 👑</h1>
        <h2>With grace and gratitude
